openapi: 3.1.0
info:
  title: TSC Go API Template
  version: 0.3.0
  description: Operational and cookie-based authentication API for a TSC modular Go monolith.
servers:
  - url: /
paths:
  /__ping:
    $ref: './modules/health.yaml#/paths/~1__ping'
  /api/v1/health:
    $ref: './modules/health.yaml#/paths/~1api~1v1~1health'
  /api/v1/auth/csrf:
    $ref: './modules/auth.yaml#/paths/~1api~1auth~1csrf'
  /api/v1/auth/login:
    $ref: './modules/auth.yaml#/paths/~1api~1auth~1login'
  /api/v1/auth/refresh:
    $ref: './modules/auth.yaml#/paths/~1api~1auth~1refresh'
  /api/v1/auth/logout:
    $ref: './modules/auth.yaml#/paths/~1api~1auth~1logout'
  /api/v1/auth/me:
    $ref: './modules/auth.yaml#/paths/~1api~1auth~1me'
  /api/v1/internal/errors:
    $ref: './modules/errors.yaml#/paths/~1api~1internal~1errors'
components:
  securitySchemes:
    CookieAuth:
      $ref: './modules/auth.yaml#/components/securitySchemes/CookieAuth'
  schemas:
    ErrorResponse:
      $ref: './modules/errors.yaml#/components/schemas/ErrorResponse'
