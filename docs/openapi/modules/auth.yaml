openapi: 3.1.0
info:
  title: Authentication module
  version: 0.3.0
  description: Cookie-based authentication and authorization contract.
paths:
  /api/v1/auth/csrf:
    get:
      summary: Issue a signed CSRF token
      security: []
      responses:
        '200':
          description: CSRF token issued in the response and cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login:
    post:
      summary: Authenticate with email and password
      security: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookies issued; tokens are never returned in JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh token and issue a new access token
      security: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Rotated session cookies issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/logout:
    post:
      summary: Revoke the refresh-token family and clear session cookies
      security: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session ended.
        '403':
          $ref: '#/components/responses/CSRFRejected'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/me:
    get:
      summary: Return the authenticated user
      security:
        - CookieAuth: []
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: tsc_access_token
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
    User:
      type: object
      required: [id, email, roles, permissions]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        roles:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {type: string}
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    CSRFResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
    ErrorResponse:
      $ref: './errors.yaml#/components/schemas/ErrorResponse'
  responses:
    InvalidRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CSRFRejected:
      description: CSRF validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Login rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Authentication is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
x-status: implemented
